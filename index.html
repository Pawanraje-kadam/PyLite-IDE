<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PyLite IDE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2300b4f2'/%3E%3Cstop offset='100%25' stop-color='%23fbbf24'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 12 L48 4 L60 32 L48 60 L16 52 L4 32 Z' fill='none' stroke='url(%23g)' stroke-width='6' stroke-linejoin='round'/%3E%3Cpath d='M20 16c0-4 4-8 10-8h12c6 0 10 4 10 8v8c0 4-4 8-10 8H30c-6 0-10-4-10-8V16z' fill='%2300b4f2'/%3E%3Ccircle cx='24' cy='20' r='3' fill='%23ffffff'/%3E%3Cpath d='M44 48c0 4-4 8-10 8H22c-6 0-10-4-10-8v-8c0-4 4-8 10-8h12c6 0 10 4 10 8v8z' fill='%23fbbf24'/%3E%3Ccircle cx='40' cy='44' r='3' fill='%230a0e17'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ═══════════════ LOADING SCREEN ═══════════════ -->
  <div id="loading-screen">
    <div class="loading-content">
      <div class="loading-logo">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="loading-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#00b4f2"/>
              <stop offset="100%" stop-color="#fbbf24"/>
            </linearGradient>
          </defs>
          <path d="M16 12 L48 4 L60 32 L48 60 L16 52 L4 32 Z" fill="none" stroke="url(#loading-grad)" stroke-width="6" stroke-linejoin="round"/>
          <path d="M20 16c0-4 4-8 10-8h12c6 0 10 4 10 8v8c0 4-4 8-10 8H30c-6 0-10-4-10-8V16z" fill="#00b4f2"/>
          <circle cx="24" cy="20" r="3" fill="#ffffff"/>
          <path d="M44 48c0 4-4 8-10 8H22c-6 0-10-4-10-8v-8c0-4 4-8 10-8h12c6 0 10 4 10 8v8z" fill="#fbbf24"/>
          <circle cx="40" cy="44" r="3" fill="#0a0e17"/>
        </svg>
      </div>
      <h1 class="loading-title">PyLite IDE</h1>
      <p class="loading-subtitle">Initializing Python runtime…</p>
      <div class="loading-bar-track">
        <div class="loading-bar-fill" id="loading-bar"></div>
      </div>
      <p class="loading-status" id="loading-status">Loading Pyodide…</p>
    </div>
  </div>

  <!-- ═══════════════ MAIN APP SHELL ═══════════════ -->
  <div id="app" class="app hidden">
    <!-- ─── TOP BAR ─── -->
    <header class="topbar">
      <div class="topbar-left">
        <svg class="topbar-logo" width="28" height="28" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="topbar-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#00b4f2"/>
              <stop offset="100%" stop-color="#fbbf24"/>
            </linearGradient>
          </defs>
          <path d="M16 12 L48 4 L60 32 L48 60 L16 52 L4 32 Z" fill="none" stroke="url(#topbar-grad)" stroke-width="6" stroke-linejoin="round"/>
          <path d="M20 16c0-4 4-8 10-8h12c6 0 10 4 10 8v8c0 4-4 8-10 8H30c-6 0-10-4-10-8V16z" fill="#00b4f2"/>
          <circle cx="24" cy="20" r="3" fill="#ffffff"/>
          <path d="M44 48c0 4-4 8-10 8H22c-6 0-10-4-10-8v-8c0-4 4-8 10-8h12c6 0 10 4 10 8v8z" fill="#fbbf24"/>
          <circle cx="40" cy="44" r="3" fill="#0a0e17"/>
        </svg>
        <span class="topbar-filename" id="current-filename">untitled.py</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-font-down" title="Decrease font" aria-label="Decrease font size">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
        </button>
        <span class="font-size-label" id="font-size-label">14</span>
        <button class="icon-btn" id="btn-font-up" title="Increase font" aria-label="Increase font size">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="btn-packages" title="Packages" aria-label="Packages">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        </button>
        <button class="icon-btn" id="btn-share" title="Share" aria-label="Share code">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
        <button class="icon-btn" id="btn-theme" title="Toggle theme" aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <!-- Desktop-only run & files buttons -->
        <button class="icon-btn desktop-only" id="btn-run-desktop" title="Run (Ctrl+Enter)" aria-label="Run code" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--accent)" id="run-icon-desk"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--error-text)" id="stop-icon-desk" class="hidden"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button class="icon-btn desktop-only" id="btn-files-desktop" title="Files" aria-label="Files">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>
    </header>

    <!-- ─── MAIN CONTENT PANELS ─── -->
    <main class="panels-container" id="panels-container">
      <!-- EDITOR PANEL -->
      <section class="panel panel-editor active" id="panel-editor" data-panel="editor">
        <div class="editor-wrap" id="editor-wrap">
          <div class="gutter" id="line-numbers" aria-hidden="true"></div>
          <div class="editor-scroll-area" id="editor-scroll-area">
            <div class="editor-layers">
              <div class="editor-highlight-layer" id="highlight-layer" aria-hidden="true"></div>
              <textarea class="editor-textarea" id="editor-textarea"
                spellcheck="false" autocapitalize="none" autocomplete="off" autocorrect="off"
                placeholder="# Write your Python code here…"></textarea>
            </div>
          </div>
        </div>
      </section>

      <!-- CONSOLE PANEL -->
      <section class="panel panel-console" id="panel-console" data-panel="console">
        <div class="console-output" id="console-output">
          <div class="console-placeholder" id="console-placeholder">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.5">
              <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
            </svg>
            <p>Run your code to see output here</p>
          </div>
        </div>
        <button class="terminal-toggle" id="terminal-toggle" aria-label="Toggle terminal">Terminal</button>
        <div class="terminal-shell hidden" id="terminal-shell">
          <div class="terminal-output" id="terminal-output"></div>
          <div class="terminal-input-row">
            <button class="terminal-clear-btn" id="terminal-clear" type="button">Clear</button>
            <span class="terminal-prompt">&gt;&gt;&gt;</span>
            <input id="terminal-input" class="terminal-input" type="text" spellcheck="false" autocomplete="off" autocapitalize="none" placeholder="Type a Python command…" />
          </div>
        </div>
      </section>

      <!-- FILES PANEL -->
      <section class="panel panel-files" id="panel-files" data-panel="files">
        <div class="files-header">
          <h2>Files</h2>
          <button class="btn-new-file" id="btn-new-file" aria-label="New file">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>New File</span>
          </button>
        </div>
        <div class="files-list" id="files-list"></div>
      </section>
    </main>

    <!-- ─── SYMBOL TOOLBAR (mobile) ─── -->
    <div class="symbol-toolbar" id="symbol-toolbar">
      <div class="symbol-scroll">
        <button class="sym-btn" data-insert="    " title="Tab">&#8677;</button>
        <button class="sym-btn" data-insert="(" title="(">(</button>
        <button class="sym-btn" data-insert=")" title=")">)</button>
        <button class="sym-btn" data-insert="[" title="[">[</button>
        <button class="sym-btn" data-insert="]" title="]">]</button>
        <button class="sym-btn" data-insert="{" title="{">{</button>
        <button class="sym-btn" data-insert="}" title="}">}</button>
        <button class="sym-btn" data-insert=":" title=":">:</button>
        <button class="sym-btn" data-insert="=" title="=">=</button>
        <button class="sym-btn" data-insert='"' title='"'>"</button>
        <button class="sym-btn" data-insert="'" title="'">'</button>
        <button class="sym-btn" data-insert="_" title="_">_</button>
        <button class="sym-btn" data-insert="#" title="#">#</button>
        <button class="sym-btn" data-insert="." title=".">.</button>
        <button class="sym-btn" data-insert="," title=",">,</button>
        <button class="sym-btn" data-insert="+" title="+">+</button>
        <button class="sym-btn" data-insert="-" title="-">-</button>
        <button class="sym-btn" data-insert="*" title="*">*</button>
        <button class="sym-btn" data-insert="/" title="/">/</button>
        <button class="sym-btn" data-insert="%" title="%">%</button>
        <button class="sym-btn" data-insert="<" title="<">&lt;</button>
        <button class="sym-btn" data-insert=">" title=">">&gt;</button>
      </div>
    </div>

    <!-- ─── BOTTOM NAV (mobile tab bar) ─── -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-tab active" data-tab="editor" aria-label="Editor">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        <span>Editor</span>
      </button>
      <button class="nav-run-btn" id="btn-run" aria-label="Run code" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" id="run-icon"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" id="stop-icon" class="hidden"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button class="nav-tab" data-tab="console" aria-label="Console">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        <span>Console</span>
      </button>
      <button class="nav-tab" data-tab="files" aria-label="Files">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span>Files</span>
      </button>
    </nav>

    <!-- ─── PACKAGE MODAL ─── -->
    <div class="modal-overlay hidden" id="pkg-modal-overlay">
      <div class="modal" id="pkg-modal">
        <div class="modal-header">
          <h3>Install Packages</h3>
          <button class="icon-btn modal-close" id="pkg-modal-close" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <p class="modal-desc">Install packages via Pyodide. They'll be available for import after installation.</p>
          <div class="pkg-list" id="pkg-list"></div>
          <div class="pkg-custom">
            <input type="text" id="pkg-custom-input" placeholder="Custom package name…" autocomplete="off">
            <button class="btn-install" id="btn-pkg-custom-install">Install</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ─── TOAST ─── -->
    <div class="toast hidden" id="toast"><span id="toast-msg"></span></div>
  </div>

  <!-- ═══════════════ SCRIPTS ═══════════════ -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.5/full/pyodide.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
